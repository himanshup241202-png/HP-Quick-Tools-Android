name: HP Quick Tools Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build HP Quick Tools
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find or Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          # 1. Check project directly in repository
          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          fi

          # 2. Search existing folders
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r -d '' settings; do
              DIR="$(dirname "$settings")"

              if [ -f "$DIR/app/build.gradle" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find . \
                -type f \
                -name "settings.gradle" \
                -not -path "./.git/*" \
                -print0
            )
          fi

          # 3. If not found, find ZIP and extract it
          if [ -z "$PROJECT_DIR" ]; then

            echo "Android project not found directly."
            echo "Searching for ZIP file..."

            ZIP_FILE=""

            while IFS= read -r -d '' zip; do
              ZIP_FILE="$zip"
              break
            done < <(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print0
            )

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project and no ZIP file found."
              echo ""
              echo "Repository files:"
              find . -maxdepth 3 -type f | head -200
              exit 1
            fi

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            mkdir -p _android_project

            unzip -q "$ZIP_FILE" -d _android_project

            echo "ZIP extracted."

            # Search extracted project
            while IFS= read -r -d '' settings; do
              DIR="$(dirname "$settings")"

              if [ -f "$DIR/app/build.gradle" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find _android_project \
                -type f \
                -name "settings.gradle" \
                -print0
            )

          fi

          # 4. Final check
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found after extraction."
            echo ""
            echo "Files found:"
            find . -maxdepth 5 -type f | head -300
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo ""
          echo "================================="
          echo "ANDROID PROJECT FOUND"
          echo "Location: $PROJECT_DIR"
          echo "================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App files:"
          ls -la app

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew missing"
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Android project verification successful."

      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Release-APK
          path: '**/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error

      - name: Upload Galaxy Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Galaxy-Store-AAB
          path: '**/app/build/outputs/bundle/release/*.aab'
          if-no-files-found: error
