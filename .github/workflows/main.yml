name: HP Quick Tools Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build HP Quick Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/settings.gradle" ] &&
               [ -f "$dir/app/build.gradle" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "settings.gradle" \
              -not -path "./.git/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Android project:"
          pwd

          ls -la
          ls -la app

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew missing"
            exit 1
          fi

          chmod +x gradlew

      - name: Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Release-APK
          path: '**/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Galaxy-Store-AAB
          path: '**/app/build/outputs/bundle/release/*.aab'
          if-no-files-found: error
