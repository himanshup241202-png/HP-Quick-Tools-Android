name: HP Quick Tools Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HP Quick Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android project
        shell: bash
        run: |
          set -e
          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "Android project OK"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Galaxy Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: HP-Quick-Tools-Galaxy-Store-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
